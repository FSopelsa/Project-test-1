name: event-management-app

services:
  mysql:
    image: mysql:8.4
    container_name: event-management-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${EVENT_DB_ROOT_PASSWORD:?Set EVENT_DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${EVENT_DB_NAME:-event_management}
      MYSQL_USER: ${EVENT_DB_USER:?Set EVENT_DB_USER in .env}
      MYSQL_PASSWORD: ${EVENT_DB_PASSWORD:?Set EVENT_DB_PASSWORD in .env}
    ports:
      - "${EVENT_DB_PORT:-3307}:3306"
    volumes:
      - event_management_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  event_management_mysql_data:
